# ============================================================
# ACCS — AI Capture Course Sound 配置 v2
# 本机实时语音识别（多引擎）+ 翻译 + 导出
# ============================================================

audio:
  # 音频来源: system(系统播放声音/网课) | mic(麦克风) | file(读文件)
  source: system
  # 后端: auto | soundcard | sounddevice
  backend: auto
  # 设备关键字(为空 = 系统默认)
  device: ""
  mic_device: ""
  system_device: ""
  # source=file 时的音频文件路径
  file: ""
  # 采样率: Whisper / SenseVoice 使用 16kHz
  sample_rate: 16000
  # 采集帧大小(毫秒)
  frame_ms: 256
  # 声道数
  channels: 1

vad:
  enabled: true
  # 语音概率阈值(开始)，越高越严格
  threshold: 0.5
  # 结束阈值 = threshold * end_ratio（双阈值滞后，避免切碎句子）
  end_ratio: 0.6
  # 判定为一个语音片段的最短时长(毫秒)
  min_speech_ms: 500
  # 说话前/后补的音频(毫秒)
  prepend_ms: 300
  pad_ms: 200
  # 静音多久判定片段结束(毫秒)
  silence_ms: 800
  # 单段最长时长(毫秒)，超过则在能量谷切开
  max_segment_ms: 30000
  # 相邻片段重叠(毫秒)，0 = 不重叠；200 可减少边界丢字
  overlap_ms: 0

transcriber:
  # 引擎:
  #   sherpa_onnx    SenseVoice / Paraformer / 流式 Zipformer（中文最佳，带标点）
  #   faster_whisper CTranslate2 Whisper
  #   openai_whisper 原版 Whisper（PyTorch）
  #   funasr         阿里 FunASR
  #   vosk           轻量离线
  #   whisper_cpp    whisper.cpp（GGML）
  #   browser        浏览器 Web Speech（由前端完成，可能依赖厂商在线服务）
  engine: sherpa_onnx

  # Whisper 模型（faster_whisper / openai_whisper 用）
  model: small

  # sherpa-onnx
  sherpa_onnx_model: ""      # 留空=自动探测 models/ 下的模型
  sherpa_onnx_type: auto     # auto | sense_voice | paraformer | transducer

  # FunASR
  funasr_model: paraformer-zh

  # Vosk
  vosk_model: ""             # 留空=自动探测 models/vosk-*

  # whisper.cpp
  whisper_cpp_bin: ""        # whisper-cli(.exe) 路径，留空=查 PATH
  whisper_cpp_model: ""      # ggml-*.bin 路径

  # 通用
  device: auto               # auto | cpu | cuda
  compute_type: auto         # auto | int8 | float16 | int8_float16 | float32
  language: ""               # ""=自动
  beam_size: 5
  word_timestamps: true
  vad_filter: false

output:
  # terminal | file | srt | jsonl | all
  # all: 额外写出 md / vtt / json / csv
  mode: terminal
  base_dir: output
  file: ""
  show_transcript_live: true
  show_language: true
