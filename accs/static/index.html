<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ACCS · 课堂实时转写</title>
<meta name="theme-color" content="#070a14" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%237c5cff'/><path d='M9 16h2v6H9zm4-4h2v10h-2zm4 2h2v6h-2zm4-5h2v9h-2z' fill='white'/></svg>" />
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 32 32" width="24" height="24">
        <defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs>
        <rect x="3" y="13" width="26" height="6" rx="3" fill="url(#g)"/>
        <rect x="9" y="7" width="2" height="18" rx="1" fill="#e8ecf8"/>
        <rect x="19" y="5" width="2.4" height="22" rx="1.2" fill="#e8ecf8"/>
      </svg>
    </span>
    <div class="brand-text"><strong>ACCS</strong><small>课堂实时转写</small></div>
  </div>
  <div class="top-status">
    <span class="pill" id="phasePill"><i class="dot" id="phaseDot"></i><span id="phaseText">未启动</span></span>
    <span class="pill ghost" id="enginePill">—</span>
    <span class="pill ghost" id="segPill">0 段</span>
  </div>
  <div class="top-actions">
    <button class="icon-btn" id="themeBtn" title="切换深色 / 浅色">
      <svg viewBox="0 0 24 24" width="17" height="17"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
    </button>
  </div>
</header>

<main class="shell">

  <!-- ============================ 左：设置 ============================ -->
  <aside class="panel settings">
    <div class="panel-head"><h2>采集</h2><span class="hint" id="backendHint">后端连接中…</span></div>

    <div class="field">
      <span>音频来源</span>
      <div class="segmented" id="sourceSeg">
        <button data-v="system" class="active">系统声音</button>
        <button data-v="mic">麦克风</button>
        <button data-v="file">音频文件</button>
        <button data-v="browser">浏览器</button>
      </div>
    </div>

    <label class="field" id="fileField" hidden>
      <span>音频文件路径</span>
      <input id="filePath" placeholder="例如 speech_zh.wav 或 D:\lecture.m4a" />
      <small>相对项目根目录，或绝对路径</small>
    </label>

    <label class="field">
      <span>识别引擎</span>
      <select id="engine"></select>
      <small id="engineNote">本地离线引擎，音频不出本机</small>
    </label>

    <div id="engineControls"></div>

    <label class="field">
      <span>语言</span>
      <select id="language">
        <option value="">自动检测</option>
        <option value="zh">中文</option>
        <option value="en">英文</option>
        <option value="ja">日文</option>
        <option value="ko">韩文</option>
      </select>
    </label>

    <details class="acc" open>
      <summary>分段（VAD）</summary>
      <div class="acc-body">
        <label class="field">
          <span>语音阈值 <b id="vThr">0.50</b></span>
          <input type="range" id="threshold" min="0.2" max="0.9" step="0.05" value="0.5" />
        </label>
        <label class="field">
          <span>静音断句 <b id="vSil">800 ms</b></span>
          <input type="range" id="silence" min="300" max="2000" step="50" value="800" />
        </label>
        <label class="field">
          <span>最长片段 <b id="vMax">30 s</b></span>
          <input type="range" id="maxSeg" min="10" max="60" step="5" value="30" />
        </label>
        <label class="field">
          <span>片段重叠 <b id="vOvl">0 ms</b></span>
          <input type="range" id="overlap" min="0" max="600" step="50" value="0" />
          <small>重叠能减少边界丢字，但会重复少量内容</small>
        </label>
      </div>
    </details>

    <details class="acc">
      <summary>翻译与分析</summary>
      <div class="acc-body">
        <label class="check"><input type="checkbox" id="translate" checked /><span>英文 → 中文（本地 LLM）</span></label>
        <label class="field"><span>LLM 地址</span><input id="llmBase" value="http://127.0.0.1:11434" /></label>
        <label class="field"><span>LLM 模型</span><input id="llmModel" value="deepseek-r1:8b" /></label>
        <p class="note">翻译与分析都走本机 Ollama，不联网。</p>
      </div>
    </details>

    <div class="start-bar">
      <button class="btn primary" id="startBtn">▶ 开始</button>
      <button class="btn danger" id="stopBtn" disabled>■ 停止</button>
    </div>
  </aside>

  <!-- ============================ 中：实时字幕 ============================ -->
  <section class="panel live">
    <div class="live-toolbar">
      <div class="search">
        <svg viewBox="0 0 24 24" width="15" height="15"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="search" placeholder="搜索转写内容…" />
      </div>
      <label class="check sm"><input type="checkbox" id="autoscroll" checked /><span>跟随</span></label>
      <label class="check sm"><input type="checkbox" id="showTrans" checked /><span>译文</span></label>
      <select id="fontSize" class="mini" title="字号">
        <option value="15">小</option>
        <option value="17" selected>中</option>
        <option value="19">大</option>
      </select>
      <button class="btn ghost sm" id="clearBtn">清空</button>
    </div>

    <div class="segments" id="segments"></div>

    <div class="empty" id="empty">
      <div class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <p>还没有内容</p>
      <span>选好来源和引擎，点「开始」；浏览器模式下会请求麦克风权限</span>
    </div>

    <div class="statsbar">
      <span id="statSegs">0 段</span>
      <span class="sep"></span>
      <span id="statDur">00:00</span>
      <span class="sep"></span>
      <span id="statEngine">—</span>
      <span class="grow"></span>
      <span class="vad" id="vadState"><i class="dot"></i><em>等待</em></span>
    </div>
  </section>

  <!-- ============================ 右：导出与分析 ============================ -->
  <aside class="panel side">
    <section class="side-block">
      <div class="panel-head"><h2>导出</h2><span class="hint">全部内容</span></div>
      <div class="export-grid">
        <button class="exp" data-fmt="zip"><b>ZIP</b><small>全套打包</small></button>
        <button class="exp" data-fmt="srt_bilingual"><b>SRT</b><small>双语字幕</small></button>
        <button class="exp" data-fmt="docx"><b>DOCX</b><small>Word 文稿</small></button>
        <button class="exp" data-fmt="csv"><b>CSV</b><small>表格</small></button>
        <button class="exp" data-fmt="json"><b>JSON</b><small>结构化</small></button>
        <button class="exp" data-fmt="md"><b>Markdown</b><small>带章节</small></button>
        <button class="exp" data-fmt="srt"><b>SRT</b><small>原文</small></button>
        <button class="exp" data-fmt="txt"><b>TXT</b><small>纯文本</small></button>
      </div>
    </section>

    <section class="side-block">
      <div class="panel-head"><h2>章节</h2><button class="btn ghost sm" id="chapBtn">生成</button></div>
      <div class="chapters" id="chapters"><p class="note">按停顿自动分章</p></div>
    </section>

    <section class="side-block">
      <div class="panel-head"><h2>分析</h2><button class="btn ghost sm" id="analyzeBtn">运行</button></div>
      <div class="analysis" id="analysis"><p class="note">用本地 LLM 纠错并提炼知识点</p></div>
    </section>
  </aside>
</main>

<footer class="statusbar">
  <span id="footStatus">就绪</span>
  <span class="grow"></span>
  <span class="muted" id="footInfo">ACCS v2.0 · 本地运行</span>
</footer>

<div class="toast" id="toast"></div>

<script src="/static/app.js"></script>
</body>
</html>
